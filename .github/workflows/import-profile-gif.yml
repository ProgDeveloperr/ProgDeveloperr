name: Import profile GIF (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-profile-gif.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Install GIF optimization tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Download and optimize requested GIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          URL1='https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMm5vc2Q0aXg0YmJ1cjRndjF3MnI3NGp0OTM4dThzeXdwZ205NnhqcSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3og0IyRiAsl1Pczi6Y/giphy.gif'
          URL2='https://media.giphy.com/media/3og0IyRiAsl1Pczi6Y/giphy.gif'
          valid=0
          for url in "$URL1" "$URL2"; do
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 12 --max-time 120 --max-filesize 90000000 "$url" --output assets/source.gif; then
              if file --mime-type assets/source.gif | grep -q 'image/gif'; then
                valid=1
                break
              fi
            fi
          done
          if [[ "$valid" != 1 ]]; then
            echo 'FAILED: Could not download original GIF.' >&2
            exit 1
          fi
          echo "Downloaded original GIF bytes: $(wc -c < assets/source.gif)"
          optimized=0
          for spec in '8 260 64' '6 200 48' '4 160 32'; do
            read -r fps width colors <<< "$spec"
            ffmpeg -hide_banner -loglevel error -y -i assets/source.gif -filter_complex "[0:v]fps=$fps,scale=$width:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=$colors:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5" -loop 0 assets/profile-animation.gif
            size=$(wc -c < assets/profile-animation.gif)
            echo "Optimized GIF at ${fps}fps, width ${width}px, ${colors} colors: ${size} bytes"
            if [[ "$size" -lt 8000000 ]] && file --mime-type assets/profile-animation.gif | grep -q 'image/gif'; then
              optimized=1
              break
            fi
          done
          if [[ "$optimized" != 1 ]]; then
            echo 'FAILED: Unable to reduce GIF below 8 MB.' >&2
            exit 1
          fi
          rm assets/source.gif
          python3 - <<'PY'
          from pathlib import Path
          path=Path('README.md')
          old='<img align="right" width="260" alt="Animación GIF decorativa" src="https://media2.giphy.com/media/3og0IyRiAsl1Pczi6Y/giphy.gif" />'
          new='<img align="right" width="260" alt="Animación GIF decorativa" src="assets/profile-animation.gif" />'
          txt=path.read_text(encoding='utf-8')
          if txt.count(old)!=1:
              raise SystemExit('README changed; refusing unexpected replacement')
          path.write_text(txt.replace(old,new),encoding='utf-8')
          PY
      - name: Commit GIF as a repository asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-animation.gif README.md
          git commit -m 'fix(profile): host optimized animated GIF locally'
          git push origin HEAD:main
